name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & attach plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # No production Composer dependencies exist (composer.json requires
      # PHP only); if any are ever added, run `composer install --no-dev`
      # here and remove "vendor" from .distignore.

      - name: Install WP-CLI and dist-archive command
        run: |
          curl -sSLO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          wp package install wp-cli/dist-archive-command:@stable

      - name: Create distribution archive
        run: wp dist-archive . "${{ github.workspace }}/unlisted-posts.zip" --plugin-dirname=unlisted-posts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: unlisted-posts.zip
          generate_release_notes: true
